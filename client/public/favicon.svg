<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Blue Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    
    <!-- Metallic Gradient for Shield -->
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Glossy Gradient for ERP Arrows -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border for Glass Effect -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Academic Shield -->
  <path d="M256 100 C256 100 140 120 120 130 C120 130 120 260 120 310 C120 400 256 460 256 460 C256 460 392 400 392 310 C392 260 392 130 392 130 C372 120 256 100 256 100 Z" 
        fill="none" stroke="url(#metal)" stroke-width="28" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Top Sync Arrow -->
  <path d="M190 260 A 70 70 0 0 1 310 220" 
        fill="none" stroke="url(#gloss)" stroke-width="36" stroke-linecap="round" filter="url(#shadow)"/>
  <polygon points="280,180 350,215 295,275" fill="url(#gloss)" filter="url(#shadow)"/>
  
  <!-- Bottom Sync Arrow -->
  <path d="M322 290 A 70 70 0 0 1 202 330" 
        fill="none" stroke="url(#gloss)" stroke-width="36" stroke-linecap="round" filter="url(#shadow)"/>
  <polygon points="232,370 162,335 217,275" fill="url(#gloss)" filter="url(#shadow)"/>
</svg>
